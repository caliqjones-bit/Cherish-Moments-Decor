# Cherish Moments Decor — Netlify configuration
# Clean URLs, 301 redirects from legacy .html paths, caching + security headers.

[build]
  publish = "."

# Netlify serves /about from about.html automatically ("Pretty URLs").
# These explicit 301s preserve SEO value from any existing links that still
# include the .html extension, sending them to the canonical clean URL.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/services.html"
  to = "/services"
  status = 301
  force = true

[[redirects]]
  from = "/residential-holiday-design.html"
  to = "/residential-holiday-design"
  status = 301
  force = true

