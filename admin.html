<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Consultations — Admin | Cherish Moments Decor</title>
  <style>
    :root {
      --evergreen: #163026; --evergreen-deep: #0d1f18;
      --winter-white: #fdfcf9; --champagne: #c9a86a; --champagne-soft: #e3cfa4;
      --ink: #2a2a28; --gold-line: rgba(201, 168, 106, 0.45);
      --font-serif: "Cormorant Garamond", Georgia, serif;
      --font-sans: "Jost", "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: var(--font-sans); color: var(--ink);
      background: #f2efe8; line-height: 1.5;
    }
    a { color: #7a5c1f; }
    .topbar {
      background: var(--evergreen-deep); color: var(--winter-white);
      padding: 1rem 1.25rem; display: flex; align-items: center; gap: 1rem;
      flex-wrap: wrap; border-bottom: 3px solid var(--champagne);
    }
    .topbar h1 {
      font-family: var(--font-serif); font-weight: 600; margin: 0;
      font-size: 1.5rem; letter-spacing: .01em;
    }
    .topbar .count { color: var(--champagne-soft); font-size: .85rem; }
    .topbar .spacer { flex: 1; }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 1.25rem; }
    button, input {
      font-family: var(--font-sans); font-size: 1rem;
    }
    button {
      background: var(--champagne); color: var(--evergreen-deep); border: 0;
      padding: .55rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600;
      letter-spacing: .03em;
    }
    button.ghost { background: transparent; color: var(--winter-white); border: 1px solid var(--gold-line); }
    button:hover { filter: brightness(1.05); }
    input[type="password"], input[type="search"], input[type="text"] {
      padding: .6rem .75rem; border: 1px solid #cdc7ba; border-radius: 6px; width: 100%;
      background: #fff;
    }
    /* Login */
    .login { max-width: 380px; margin: 12vh auto; background: #fff; padding: 2rem;
      border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.08); text-align: center; }
    .login h2 { font-family: var(--font-serif); font-size: 1.7rem; margin: 0 0 .25rem; color: var(--evergreen-deep); }
    .login p { color: #6b6b66; margin: 0 0 1.25rem; font-size: .92rem; }
    .login form { display: flex; flex-direction: column; gap: .75rem; }
    .err { color: #a12b2b; font-size: .88rem; min-height: 1.2em; margin-top: .25rem; }
    /* Toolbar */
    .toolbar { display: flex; gap: .75rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .toolbar input[type="search"] { flex: 1; min-width: 180px; }
    .toolbar .toggle { display: flex; align-items: center; gap: .45rem; white-space: nowrap; color: #5a5442; font-size: .92rem; cursor: pointer; }
    .toolbar .toggle input { width: auto; }
    .toolbar button { background: #e7e1d4; color: var(--evergreen-deep); }
    /* Cards */
    .card { background: #fff; border: 1px solid #e6e0d3; border-left: 4px solid var(--champagne);
      border-radius: 10px; padding: 1rem 1.15rem; margin-bottom: 1rem; }
    .card-head { display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; }
    .card-head .name { font-family: var(--font-serif); font-size: 1.35rem; font-weight: 600; color: var(--evergreen-deep); }
    .card-head .when { color: #8a8a84; font-size: .82rem; margin-left: auto; }
    .badge { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em;
      padding: .18rem .5rem; border-radius: 999px; font-weight: 700; }
    .badge.confirmed, .badge.completed { background: #dff0e4; color: #1c6b3f; }
    .badge.partial   { background: #fdf0d6; color: #8a6218; }
    .badge.received, .badge.needs_attention { background: #fbe0dd; color: #a12b2b; }
    .badge.open { background: #e7e1d4; color: #5a5442; }
    .badge.deleted { background: #eee; color: #999; }
    .deleted-bar { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .deleted-bar .deleted-note { flex: 1; min-width: 220px; margin: 0; }
    .deleted-note { color: #7a746a; font-size: .9rem; margin: 0 0 1rem; }
    .purge-all { background: #a12b2b; color: #fff; white-space: nowrap; }
    .purge-all:hover { filter: brightness(1.08); }
    .card.is-deleted { border-left-color: #bbb; opacity: .9; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: .5rem 1.25rem; margin-top: .85rem; }
    .field .label { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: #9a948a; display: block; }
    .field .val { font-size: .95rem; word-break: break-word; }
    .notes { margin-top: .85rem; padding-top: .75rem; border-top: 1px dashed #e0dacd; }
    .notes .label { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: #9a948a; }
    .flags { margin-top: .75rem; display: flex; gap: .5rem; flex-wrap: wrap; }
    .flag { font-size: .7rem; padding: .15rem .5rem; border-radius: 4px; background: #eee; color: #666; }
    .flag.on { background: #dff0e4; color: #1c6b3f; }
    .actions { margin-top: .85rem; padding-top: .75rem; border-top: 1px solid #eee; display: flex; gap: .5rem; flex-wrap: wrap; }
    .actions button { font-size: .82rem; padding: .4rem .85rem; }
    .actions .mark { background: #1c6b3f; color: #fff; }
    .actions .unmark { background: #e7e1d4; color: var(--evergreen-deep); }
    .actions .danger { background: #fbe0dd; color: #a12b2b; margin-left: auto; }
    .empty, .loading { text-align: center; color: #7a746a; padding: 3rem 1rem; }
    .hidden { display: none !important; }

    /* ---------- Mobile ---------- */
    @media (max-width: 560px) {
      .topbar { padding: .8rem 1rem; gap: .5rem .6rem; }
      .topbar h1 { font-size: 1.3rem; }
      .topbar button { padding: .45rem .7rem; font-size: .88rem; }
      .wrap { padding: 1rem; }
      /* Stack search and the toggle so the search field gets full width */
      .toolbar { flex-direction: column; align-items: stretch; gap: .6rem; }
      .toolbar .toggle { align-self: flex-start; }
      .card { padding: .9rem 1rem; }
      .card-head .name { font-size: 1.2rem; }
      /* Give action buttons room; keep Delete from crowding on one line */
      .actions button { flex: 1 1 auto; }
      .actions .danger { margin-left: 0; }
      .purge-all { width: 100%; }
    }
  </style>
</head>
<body>
  <!-- Login screen -->
  <div id="login-screen" class="login">
    <h2>Consultations</h2>
    <p>Enter the admin password to view booking requests.</p>
    <form id="login-form">
      <input type="password" id="pw" placeholder="Admin password" autocomplete="current-password" required autofocus>
      <button type="submit">Sign in</button>
      <div class="err" id="login-err"></div>
    </form>
  </div>

  <!-- Dashboard -->
  <div id="dash" class="hidden">
    <div class="topbar">
      <h1 id="view-title">Consultations</h1>
      <span class="count" id="count"></span>
      <span class="spacer"></span>
      <button class="ghost" id="show-deleted">Recently deleted</button>
      <button class="ghost hidden" id="show-active">← Consultations</button>
      <button class="ghost" id="refresh">Refresh</button>
      <button class="ghost" id="logout">Log out</button>
    </div>
    <div class="wrap">
      <div class="toolbar" id="toolbar">
        <input type="search" id="search" placeholder="Search name, email, city, project type…">
        <label class="toggle"><input type="checkbox" id="hide-completed"> Hide completed</label>
      </div>
      <div id="deleted-bar" class="deleted-bar hidden">
        <p class="deleted-note">Deleted consultations are kept here so you can recover them. "Delete permanently" cannot be undone.</p>
        <button id="purge-all" type="button" class="purge-all hidden">Empty Recently Deleted</button>
      </div>
      <div id="list"></div>
      <div id="state"></div>
    </div>
  </div>

  <script>
    var KEY = "cmd_admin_pw";
    var all = [];        // active consultations
    var deleted = [];    // recently-deleted consultations
    var view = "active"; // "active" | "deleted"

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c];
      });
    }
    function fmtDate(iso) {
      if (!iso) return "";
      var d = new Date(iso);
      if (isNaN(d)) return esc(iso);
      return d.toLocaleString(undefined, { month:"short", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit" });
    }
    function field(label, val, opts) {
      if (val == null || val === "") return "";
      opts = opts || {};
      var inner = opts.html ? val : esc(val);
      return '<div class="field"><span class="label">' + esc(label) + '</span><span class="val">' + inner + '</span></div>';
    }

    function cardHTML(r, mode) {
      var name = (r.full_name || ((r.first_name || "") + " " + (r.last_name || ""))).trim() || "(no name)";
      var status = (r.status || "received").toLowerCase();
      var email = r.email ? '<a href="mailto:' + esc(r.email) + '">' + esc(r.email) + '</a>' : "";
      var phone = r.phone ? '<a href="tel:' + esc(r.phone) + '">' + esc(r.phone) + '</a>' : "";
      var notes = r.notes ? '<div class="notes"><span class="label">Notes</span><div>' + esc(r.notes) + '</div></div>' : "";

      var badge, when, actions, flags = "";
      if (mode === "deleted") {
        badge = '<span class="badge deleted">deleted</span>';
        when = '<span class="when">Deleted ' + fmtDate(r.updated_at) + '</span>';
        actions = '<div class="actions">' +
          '<button class="mark" data-action="restore" data-id="' + esc(r.id) + '">Recover</button>' +
          '<button class="danger" data-action="deleteForever" data-id="' + esc(r.id) + '">Delete permanently</button></div>';
      } else {
        var completed = status === "completed";
        var toggleBtn = completed
          ? '<button class="unmark" data-action="toggle" data-id="' + esc(r.id) + '" data-to="open">Mark not completed</button>'
          : '<button class="mark" data-action="toggle" data-id="' + esc(r.id) + '" data-to="completed">Mark completed</button>';
        badge = '<span class="badge ' + esc(status) + '">' + esc(status.replace(/_/g, " ")) + '</span>';
        when = '<span class="when">' + fmtDate(r.created_at) + '</span>';
        flags = '<div class="flags">' +
          '<span class="flag ' + (r.email_sent ? "on" : "") + '">customer email ' + (r.email_sent ? "sent" : "—") + '</span>' +
          '<span class="flag ' + (r.staff_notified ? "on" : "") + '">staff notified ' + (r.staff_notified ? "yes" : "—") + '</span>' +
          '</div>';
        actions = '<div class="actions">' + toggleBtn +
          '<button class="danger" data-action="delete" data-id="' + esc(r.id) + '">Delete</button></div>';
      }

      return '' +
        '<div class="card' + (mode === "deleted" ? " is-deleted" : "") + '">' +
          '<div class="card-head">' +
            '<span class="name">' + esc(name) + '</span>' + badge + when +
          '</div>' +
          '<div class="grid">' +
            field("Email", email, { html: true }) +
            field("Phone", phone, { html: true }) +
            field("Project type", r.project_type) +
            field("City", r.city) +
            field("Address", r.project_address) +
            field("Install date", r.preferred_installation_date) +
            field("Consultation date", r.consultation_date) +
            field("Tree height", r.tree_height) +
            field("Tree count", r.tree_count) +
            field("Services", r.services_requested) +
            field("Budget", r.budget) +
            field("Format", r.consultation_format) +
          '</div>' +
          notes + flags + actions +
        '</div>';
    }

    function render(rows, mode) {
      mode = mode || "active";
      var list = document.getElementById("list");
      var state = document.getElementById("state");
      if (!rows.length) {
        list.innerHTML = "";
        state.innerHTML = '<div class="empty">' +
          (mode === "deleted" ? "Nothing in Recently Deleted." : "No consultations yet.") + '</div>';
        return;
      }
      state.innerHTML = "";
      list.innerHTML = rows.map(function (r) { return cardHTML(r, mode); }).join("");
    }

    function applySearch() {
      var q = document.getElementById("search").value.trim().toLowerCase();
      var hideDone = document.getElementById("hide-completed").checked;
      render(all.filter(function (r) {
        if (hideDone && (r.status || "").toLowerCase() === "completed") return false;
        if (!q) return true;
        return [r.full_name, r.first_name, r.last_name, r.email, r.city, r.project_type, r.notes]
          .join(" ").toLowerCase().indexOf(q) !== -1;
      }), "active");
    }

    function showDash() {
      document.getElementById("login-screen").classList.add("hidden");
      document.getElementById("dash").classList.remove("hidden");
    }
    function showLogin(msg) {
      document.getElementById("dash").classList.add("hidden");
      document.getElementById("login-screen").classList.remove("hidden");
      document.getElementById("login-err").textContent = msg || "";
    }

    // Single fetch helper. Returns parsed data, or null after handling auth/network.
    async function fetchAction(pw, payload) {
      payload.password = pw;
      var res, data;
      try {
        res = await fetch("/api/consultations", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        data = await res.json();
      } catch (e) {
        document.getElementById("state").innerHTML = '<div class="empty">Network error. Try again.</div>';
        return null;
      }
      if (res.status === 401) { sessionStorage.removeItem(KEY); showLogin("Incorrect password."); return null; }
      if (res.status === 503) { showLogin("Admin view isn't enabled yet (ADMIN_PASSWORD not set in Vercel)."); return null; }
      return data;
    }

    async function load(pw) {
      document.getElementById("state").innerHTML = '<div class="loading">Loading…</div>';
      var data = await fetchAction(pw, { action: "list" });
      if (!data) return;
      if (!data.ok) { document.getElementById("state").innerHTML = '<div class="empty">Error: ' + esc(data.error || "unknown") + '</div>'; return; }
      all = data.consultations || [];
      document.getElementById("count").textContent = all.length + (all.length === 1 ? " request" : " requests");
      applySearch();
    }

    async function loadDeleted(pw) {
      document.getElementById("state").innerHTML = '<div class="loading">Loading…</div>';
      var data = await fetchAction(pw, { action: "listDeleted" });
      if (!data) return;
      if (!data.ok) { document.getElementById("state").innerHTML = '<div class="empty">Error: ' + esc(data.error || "unknown") + '</div>'; return; }
      deleted = data.consultations || [];
      document.getElementById("count").textContent = deleted.length + " in Recently Deleted";
      document.getElementById("purge-all").classList.toggle("hidden", deleted.length === 0);
      render(deleted, "deleted");
    }

    function refresh() {
      var pw = sessionStorage.getItem(KEY);
      if (!pw) return;
      if (view === "deleted") loadDeleted(pw); else load(pw);
    }

    function showActiveView() {
      view = "active";
      document.getElementById("view-title").textContent = "Consultations";
      document.getElementById("toolbar").classList.remove("hidden");
      document.getElementById("deleted-bar").classList.add("hidden");
      document.getElementById("show-deleted").classList.remove("hidden");
      document.getElementById("show-active").classList.add("hidden");
      refresh();
    }
    function showDeletedView() {
      view = "deleted";
      document.getElementById("view-title").textContent = "Recently Deleted";
      document.getElementById("toolbar").classList.add("hidden");
      document.getElementById("deleted-bar").classList.remove("hidden");
      document.getElementById("show-deleted").classList.add("hidden");
      document.getElementById("show-active").classList.remove("hidden");
      refresh();
    }

    // Wire up
    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();
      var pw = document.getElementById("pw").value;
      document.getElementById("login-err").textContent = "";
      showDash();
      sessionStorage.setItem(KEY, pw); // optimistic; cleared on 401 by fetchAction
      showActiveView();
    });
    document.getElementById("refresh").addEventListener("click", refresh);
    document.getElementById("show-deleted").addEventListener("click", showDeletedView);
    document.getElementById("show-active").addEventListener("click", showActiveView);
    document.getElementById("purge-all").addEventListener("click", function () {
      var n = deleted.length;
      if (!n) return;
      if (!confirm("Permanently delete ALL " + n + " consultation" + (n === 1 ? "" : "s") + " in Recently Deleted? This cannot be undone.")) return;
      doAction({ action: "purgeDeleted" });
    });
    document.getElementById("logout").addEventListener("click", function () {
      sessionStorage.removeItem(KEY); document.getElementById("pw").value = ""; view = "active"; showLogin("");
    });
    document.getElementById("search").addEventListener("input", applySearch);
    document.getElementById("hide-completed").addEventListener("change", applySearch);

    // Per-card actions via delegation
    async function doAction(payload) {
      var pw = sessionStorage.getItem(KEY);
      if (!pw) { showLogin("Session expired — sign in again."); return; }
      var data = await fetchAction(pw, payload);
      if (!data) return;
      if (!data.ok) { alert("Action failed: " + (data.error || "unknown")); return; }
      refresh();
    }
    document.getElementById("list").addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-action]");
      if (!btn) return;
      var id = btn.getAttribute("data-id");
      var action = btn.getAttribute("data-action");
      if (action === "toggle") {
        doAction({ action: "setStatus", id: id, status: btn.getAttribute("data-to") });
      } else if (action === "delete") {
        if (!confirm("This consultation will be moved to Recently Deleted, where you can recover it if needed. Continue?")) return;
        doAction({ action: "delete", id: id });
      } else if (action === "restore") {
        doAction({ action: "restore", id: id });
      } else if (action === "deleteForever") {
        if (!confirm("Permanently delete this consultation? This cannot be undone.")) return;
        doAction({ action: "deleteForever", id: id });
      }
    });

    // Auto-load if already signed in this session
    (function () {
      var pw = sessionStorage.getItem(KEY);
      if (pw) { showDash(); showActiveView(); }
    })();
  </script>
</body>
</html>
